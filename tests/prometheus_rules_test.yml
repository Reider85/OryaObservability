# promtool test rules for P21 recording rules + PC32 sampler alert.
#
# Run (inside the repo root):
#   docker run --rm --entrypoint promtool -v "%cd%/infra:/infra" -v "%cd%/tests:/tests" \
#     prom/prometheus test rules /tests/prometheus_rules_test.yml
#
# Recording-rule results carry __name__ on current Prometheus; expected labels
# below include it deliberately.

rule_files:
  - /infra/prometheus-rules.yml

evaluation_interval: 1m

tests:
  # --- Overall kept ratio on a fixed set of traces --------------------------
  - interval: 1m
    name: kept ratio is 100 / (100 + 400) = 0.2
    input_series:
      - series: 'otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled"}'
        values: "100"
      - series: 'otelcol_processor_tail_sampling_count_traces_sampled{decision="dropped"}'
        values: "400"
    promql_expr_test:
      - expr: job:tail_sampler_kept_ratio:ratio
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="job:tail_sampler_kept_ratio:ratio"}'
            value: 0.2

  # --- All kept -------------------------------------------------------------
  - interval: 1m
    name: all traces kept → ratio 1
    input_series:
      - series: 'otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled"}'
        values: "50"
      - series: 'otelcol_processor_tail_sampling_count_traces_sampled{decision="dropped"}'
        values: "0"
    promql_expr_test:
      - expr: job:tail_sampler_kept_ratio:ratio
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="job:tail_sampler_kept_ratio:ratio"}'
            value: 1

  # --- Keep reasons are distinguishable -------------------------------------
  - interval: 1m
    name: per-reason breakdown (error/cost/security/normal)
    input_series:
      - series: 'otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled",reason="error-keep"}'
        values: "30"
      - series: 'otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled",reason="cost-over-budget-keep"}'
        values: "20"
      - series: 'otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled",reason="security-incident-keep"}'
        values: "10"
      - series: 'otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled",reason="normal-sample"}'
        values: "40"
      - series: 'otelcol_processor_tail_sampling_count_traces_sampled{decision="dropped"}'
        values: "400"
    promql_expr_test:
      - expr: job:tail_sampler_kept_ratio:ratio
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="job:tail_sampler_kept_ratio:ratio"}'
            value: 0.2
      - expr: job:tail_sampler_kept_by_reason:ratio
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="job:tail_sampler_kept_by_reason:ratio", reason="error-keep"}'
            value: 0.3
          - labels: '{__name__="job:tail_sampler_kept_by_reason:ratio", reason="cost-over-budget-keep"}'
            value: 0.2
          - labels: '{__name__="job:tail_sampler_kept_by_reason:ratio", reason="security-incident-keep"}'
            value: 0.1
          - labels: '{__name__="job:tail_sampler_kept_by_reason:ratio", reason="normal-sample"}'
            value: 0.4

  # --- Normal-sample-only case (10% keep rate) ------------------------------
  - interval: 1m
    name: only normal-sample kept traces (10% rate)
    input_series:
      - series: 'otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled",reason="normal-sample"}'
        values: "10"
      - series: 'otelcol_processor_tail_sampling_count_traces_sampled{decision="dropped"}'
        values: "90"
    promql_expr_test:
      - expr: job:tail_sampler_kept_ratio:ratio
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="job:tail_sampler_kept_ratio:ratio"}'
            value: 0.1
      - expr: job:tail_sampler_kept_by_reason:ratio
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="job:tail_sampler_kept_by_reason:ratio", reason="normal-sample"}'
            value: 1

  # --- PC21: cron scrape target is up --------------------------------------
  - interval: 1m
    name: healthy cron target does not fire CronTargetDown
    input_series:
      - series: 'up{job="cron",instance="cron:9777"}'
        values: "1+0x10"
    promql_expr_test:
      - expr: up{job="cron"} == 0
        eval_time: 10m
        exp_samples: []

  - interval: 1m
    name: unreachable cron target fires CronTargetDown
    input_series:
      - series: 'up{job="cron",instance="cron:9777"}'
        values: "0+0x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: CronTargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: cron
              instance: cron:9777
            exp_annotations:
              summary: "cron maintenance service is not scrapeable"
              description: >-
                Prometheus has been unable to scrape cron:9777 for 5 minutes, so all
                tiered-retention jobs (vault TTL cleanup, audit archival, eval warm
                migration) have stopped. Restart the `cron` container.

  # --- PC21: hourly vault cleanup staleness ---------------------------------
  # The threshold is 2h but `for: 5m` pushes the first *firing* evaluation out
  # by one more interval, so the alert is still pending at 2h5m.
  - interval: 1m
    name: cleanup_vault just inside 2 cycles must not page
    input_series:
      - series: 'agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_vault"}'
        values: "0+0x200"
    promql_expr_test:
      - expr: (time() - agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_vault"}) > 7200
        eval_time: 100m
        exp_samples: []

  - interval: 1m
    name: cleanup_vault past 2 hourly cycles fires
    input_series:
      - series: 'agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_vault"}'
        values: "0+0x200"
    promql_expr_test:
      - expr: (time() - agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_vault"}) > 7200
        eval_time: 2h10m
        exp_samples:
          - labels: '{job_name="cleanup_vault"}'
            value: 7800
    alert_rule_test:
      - eval_time: 2h10m
        alertname: CronHourlyJobStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job_name: cleanup_vault
            exp_annotations:
              summary: "cleanup_vault has not succeeded for more than 2 hourly cycles"
              description: >-
                The hourly vault TTL cleanup last succeeded at 2h 10m 0s ago (threshold
                2h). Expired PII vault entries are accumulating and their audit trail
                is being lost.

  # --- PC21: daily jobs staleness ------------------------------------------
  # NB: these must stay at interval 1m (matching the production
  # evaluation_interval) — at 1h granularity the `for: 5m` clause can never
  # latch, so the alert stays pending and promtool reports no firing alert.
  - interval: 1m
    name: daily jobs fresh -> no alert
    input_series:
      - series: 'agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_audit_events"}'
        values: "0+0x600"
      - series: 'agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_eval_results"}'
        values: "0+0x600"
      - series: 'agent_obs_cron_last_success_timestamp_seconds{job_name="migrate_spans_to_warm"}'
        values: "0+0x600"
    promql_expr_test:
      - expr: (time() - agent_obs_cron_last_success_timestamp_seconds{job_name=~"cleanup_audit_events|cleanup_eval_results|migrate_spans_to_warm"}) > 172800
        eval_time: 8h
        exp_samples: []

  - interval: 1m
    name: daily jobs past 2 cycles -> all three alerts fire
    input_series:
      - series: 'agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_audit_events"}'
        values: "0+0x4000"
      - series: 'agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_eval_results"}'
        values: "0+0x4000"
      - series: 'agent_obs_cron_last_success_timestamp_seconds{job_name="migrate_spans_to_warm"}'
        values: "0+0x4000"
    promql_expr_test:
      - expr: (time() - agent_obs_cron_last_success_timestamp_seconds{job_name=~"cleanup_audit_events|cleanup_eval_results|migrate_spans_to_warm"}) > 172800
        eval_time: 51h
        exp_samples:
          - labels: '{job_name="cleanup_audit_events"}'
            value: 183600
          - labels: '{job_name="cleanup_eval_results"}'
            value: 183600
          - labels: '{job_name="migrate_spans_to_warm"}'
            value: 183600
    alert_rule_test:
      - eval_time: 51h
        alertname: CronDailyJobStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job_name: cleanup_audit_events
            exp_annotations:
              summary: "cleanup_audit_events has not succeeded for more than 2 daily cycles"
              description: >-
                Last successful run was 2d 3h 0m 0s ago (threshold 48h). Audit events are
                past their 365-day retention window, or eval results are past their
                14-day hot window, or spans are past their 14-day hot window, and the hot
                tier keeps growing past its ClickHouse TTL.
          - exp_labels:
              severity: warning
              job_name: cleanup_eval_results
            exp_annotations:
              summary: "cleanup_eval_results has not succeeded for more than 2 daily cycles"
              description: >-
                Last successful run was 2d 3h 0m 0s ago (threshold 48h). Audit events are
                past their 365-day retention window, or eval results are past their
                14-day hot window, or spans are past their 14-day hot window, and the hot
                tier keeps growing past its ClickHouse TTL.
          - exp_labels:
              severity: warning
              job_name: migrate_spans_to_warm
            exp_annotations:
              summary: "migrate_spans_to_warm has not succeeded for more than 2 daily cycles"
              description: >-
                Last successful run was 2d 3h 0m 0s ago (threshold 48h). Audit events are
                past their 365-day retention window, or eval results are past their
                14-day hot window, or spans are past their 14-day hot window, and the hot
                tier keeps growing past its ClickHouse TTL.

  # --- PC22: 3 failed hot->warm retries within 2h -> alert ------------------
  # for: 5m with interval 1m: condition holds from ~minute 5, first firing
  # evaluation at minute 10; eval_time 30m is well past that.
  - interval: 1m
    name: PC22 migration failed 3 times -> CronMigrationHotToWarmFailed fires
    input_series:
      - series: 'agent_obs_cron_errors_total{job_name="migrate_spans_to_warm"}'
        values: "0+0x4 1 2 3+0x57"
    alert_rule_test:
      - eval_time: 30m
        alertname: CronMigrationHotToWarmFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job_name: migrate_spans_to_warm
            exp_annotations:
              summary: "migrate_spans_to_warm failed 3 times within 2h"
              description: >-
                The hot-to-warm migration exhausted its 3 retries (PC22: every 30
                minutes). Postgres warm is likely unreachable. Spans past their
                14-day hot window are accumulating in ClickHouse and will be lost
                once the hot TTL expires.

  # --- PC21: the staleness clock is driven by last_success, not run count ----
  - interval: 1m
    name: hourly successes keep cleanup_vault quiet past the 2h threshold
    input_series:
      - series: 'agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_vault"}'
        # one success per hour, so the age never exceeds 1h
        values: "0 3600 7200 10800 14400 18000 21600 25200 28800+0x600"
    promql_expr_test:
      - expr: (time() - agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_vault"}) > 7200
        eval_time: 600m
        exp_samples: []

  # --- PC32: sampler stuck at cpu_high 5% rate ------------------------------
  # for: 30m means the alert latches one evaluation interval after the
  # condition has held for the full half hour. Interval is 1m, so the first
  # *firing* evaluation is at >= 30m.
  - interval: 1m
    name: cpu_high rate held below 30m stays pending (no page)
    input_series:
      - series: 'agent_obs_tail_sampler_current_rate{policy_reason="cpu_high"}'
        values: "0.05+0x40"
    promql_expr_test:
      - expr: agent_obs_tail_sampler_current_rate{policy_reason="cpu_high"} == 0.05
        eval_time: 25m
        exp_samples:
          - labels: '{__name__="agent_obs_tail_sampler_current_rate", policy_reason="cpu_high"}'
            value: 0.05

  - interval: 1m
    name: cpu_high rate held past 30m fires SamplerRateStuckAtCpuHigh
    input_series:
      - series: 'agent_obs_tail_sampler_current_rate{policy_reason="cpu_high"}'
        values: "0.05+0x60"
    alert_rule_test:
      - eval_time: 35m
        alertname: SamplerRateStuckAtCpuHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              component: sampler
              policy_reason: cpu_high
            exp_annotations:
              summary: "tail sampler pinned at 5% (cpu_high) for over 30 minutes"
              description: >-
                agent_obs_tail_sampler_current_rate has been 0.05 with
                policy_reason=cpu_high for more than 30 minutes. System CPU has
                stayed above the policy threshold (default 0.8) the whole time, so
                the sampler is keeping only 5% of normal traces. Scale the host or
                investigate the load. Rate history: Grafana dashboard
                "Sampler Policy History" (http://localhost:3001/d/sampler-policy-history);
                audit rows via GET /audit/sampler-rate-history.

  - interval: 1m
    name: default rate never fires SamplerRateStuckAtCpuHigh
    input_series:
      - series: 'agent_obs_tail_sampler_current_rate{policy_reason="default"}'
        values: "0.10+0x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: SamplerRateStuckAtCpuHigh
        exp_alerts: []

  - interval: 1m
    name: error_high 30% rate never fires SamplerRateStuckAtCpuHigh
    input_series:
      - series: 'agent_obs_tail_sampler_current_rate{policy_reason="error_high"}'
        values: "0.30+0x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: SamplerRateStuckAtCpuHigh
        exp_alerts: []

  - interval: 1m
    name: cpu_high rate recovered away from 0.05 clears the alert
    input_series:
      # held at 0.05 for 20m, then the policy moves the rate up
      - series: 'agent_obs_tail_sampler_current_rate{policy_reason="cpu_high"}'
        values: "0.05+0x20 0.10+0x20"
    alert_rule_test:
      - eval_time: 45m
        alertname: SamplerRateStuckAtCpuHigh
        exp_alerts: []

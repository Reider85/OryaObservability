# Redis Sentinel configuration for HA
# This file is used by all Redis Sentinel nodes in the cluster

# Sentinel monitoring configuration
sentinel monitor mymaster redis-master 6379 2
sentinel down-after-milliseconds mymaster 30000
sentinel parallel-syncs mymaster 1
sentinel failover-timeout mymaster 180000

# Additional sentinel settings
sentinel announce-ip redis-sentinel-1
sentinel announce-port 26379

# Log settings
logfile /var/log/redis/sentinel.log
loglevel notice

# Network settings
bind 0.0.0.0
port 26379
timeout 300
tcp-keepalive 60

# Security settings
requirepass ${REDIS_AUTH:-orya-local-redis-secret}

# Protected mode
protected-mode no

# Memory settings
maxmemory-policy allkeys-lru

# Persistence settings
save 900 1
save 300 10
save 60 10000

# Auto-aof-rewrite-percentage 100
# Auto-aof-rewrite-min-size 64mb

# Slow log settings
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client settings
maxclients 10000

# Include additional configuration if present
include /etc/redis/sentinel-local.conf
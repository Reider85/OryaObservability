# Redis TLS listener for the internal mTLS mesh (PP02 / T3.0.2).
# Plaintext port 6379 stays available for in-cluster application clients that
# cannot present client certificates (Langfuse); all infrastructure clients
# must use the mTLS port 6380. Cert paths are provided by the certs_redis
# named volume (see certs-init.sh).

port 6379
tls-port 6380

tls-cert-file /etc/redis/certs/redis.pem
tls-key-file /etc/redis/certs/redis-key.pem
tls-ca-cert-file /etc/redis/certs/ca.pem
tls-auth-clients require
tls-protocols "TLSv1.2 TLSv1.3"

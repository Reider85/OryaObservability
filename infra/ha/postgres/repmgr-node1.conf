node_id=1
node_name=pg-primary
conninfo=host=pg-primary port=5432 user=repmgr dbname=repmgr connect_timeout=2 application_name=pg-primary
primary_conninfo=host=pg-primary port=5432 user=repmgr dbname=repmgr connect_timeout=2
pg_bindir=/usr/lib/postgresql/17/bin
failover=automatic
promote_command=/etc/repmgr/scripts/promote-hook.sh
follow_command=/etc/repmgr/scripts/follow-hook.sh
rejoin_command=/etc/repmgr/scripts/rejoin-hook.sh
event_notifications=primary_standby_disconnect,standby_promote
connection_check_type=ping
connection_check_interval=10
election_reregister_timeout=300
monitor_interval_secs=10
monitor_interval_master=5
monitor_interval_standby=5
log_level=INFO
log_file=/var/log/postgresql/repmgr.log
data_directory=/var/lib/postgresql/data
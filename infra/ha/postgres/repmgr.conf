# repmgr configuration for PostgreSQL HA cluster
# This file is used by all PostgreSQL nodes in the cluster

# Cluster-wide settings
repmgr_cluster = observability
repmgr_node_name = %n
repmgr_priority = 100
repmgr_monitor_interval_secs = 10
repmgr_monitor_interval_master = 5
repmgr_monitor_interval_standby = 5
repmgr_service = %d
repmgr_user = repmgr
repmgr_password = ${REPMGR_PASSWORD:-repmgr}
repmgr_port = 5432
repmgr_connect_timeout = 2
repmgr_reconnect_attempts = 3
repmgr_reconnect_interval = 5
repmgr_log_level = INFO
repmgr_log_file = /var/log/postgresql/repmgr.log
repmgr_data_directory = /var/lib/postgresql/data
repmgr_streaming_user = repmgr
repmgr_streaming_password = ${REPMGR_PASSWORD:-repmgr}

# Node-specific settings (will be overridden by environment variables)
repmgr_primary_conninfo = host=pg-primary port=5432 user=repmgr password=repmgr dbname=langfuse connect_timeout=2
repmgr_standby_mode = off
repmgr_service_name = postgresql

# Failover settings
repmgr_failover = automatic
repmgr_failover_command = /usr/local/bin/repmgr standby promote --fast-checkpoint --copy-external-configuration-files
repmgr_follow_command = /usr/local/bin/repmgr standby follow --log-level=INFO --wait-sync=30
repmgr_node_rejoin_command = /usr/local/bin/repmgr standby rejoin --log-level=INFO

# Election settings
repmgr_election_mode = automatic
repmgr_election_timeout = 30000
repmgr_election_voting_delay = 5000

# Monitoring settings
repmgr_monitor_interval_secs = 10
repmgr_monitor_interval_master = 5
repmgr_monitor_interval_standby = 5
repmgr_monitor_interval_archive = 60
repmgr_monitor_interval_archive_standby = 60

# Settings for standby promotion
repmgr_standby_promote_command = /usr/local/bin/repmgr standby promote --fast-checkpoint --copy-external-configuration-files
repmgr_standby_follow_command = /usr/local/bin/repmgr standby follow --log-level=INFO --wait-sync=30

# Settings for node rejoin
repmgr_node_rejoin_command = /usr/local/bin/repmgr standby rejoin --log-level=INFO

# Settings for failover
repmgr_failover = automatic
repmgr_failover_command = /usr/local/bin/repmgr standby promote --fast-checkpoint --copy-external-configuration-files
repmgr_follow_command = /usr/local/bin/repmgr standby follow --log-level=INFO --wait-sync=30

# Settings for monitoring
repmgr_monitor_interval_secs = 10
repmgr_monitor_interval_master = 5
repmgr_monitor_interval_standby = 5
repmgr_monitor_interval_archive = 60
repmgr_monitor_interval_archive_standby = 60
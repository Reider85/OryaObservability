[pgbouncer]
; PgBouncer configuration for connection pooling
; This file provides connection pooling for PostgreSQL HA cluster

; General settings
pool_mode = transaction
default_pool_size = 20
max_client_conn = 100
reserve_pool_size = 5

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_statement = none

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/users.txt

; Database configuration
[databases]
; Langfuse database - read/write to primary, read-only to replicas
; Applications should connect to pgbouncer:6432
langfuse = host=pg-primary port=5432 dbname=langfuse

; Additional databases for future use
; warm = host=pg-warm port=5432 dbname=warm_store

; User settings for pooling
[users]
langfuse = pool_size=20
repmgr = pool_size=5

; System users
pgbouncer = pool_size=1

; Timeouts
server_idle_timeout = 3600
client_idle_timeout = 0
server_lifetime = 0
server_idle_transaction_timeout = 0
query_timeout = 0
idle_transaction_timeout = 0

; Performance settings
default_pool_size = 20
max_db_connections = 100
reserve_pool_size = 5

; TLS / mTLS settings (PP02). Certs come from the certs_pgbouncer volume.
; Clients: certificate chain is verified against the internal CA (verify-ca,
; CN is not enforced so app-layer password auth still applies).
; Upstream: full mTLS to Postgres as user langfuse (server cert CN=langfuse
; matches the database role required by `cert clientcert=verify-full`).
client_tls_sslmode = verify-ca
client_tls_ca_file = /certs/ca.pem
client_tls_cert_file = /certs/pgbouncer.pem
client_tls_key_file = /certs/pgbouncer-key.pem

server_tls_sslmode = verify-full
server_tls_ca_file = /certs/ca.pem
server_tls_cert_file = /certs/langfuse.pem
server_tls_key_file = /certs/langfuse-key.pem

; Unix socket settings
unix_socket_dir = /var/run/postgresql
unix_socket_mode = 0770

; Admin console settings
admin_users = pgbouncer
stats_period = 60

; Logging settings
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_statement = none
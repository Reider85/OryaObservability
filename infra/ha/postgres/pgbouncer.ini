[pgbouncer]
; PgBouncer configuration for connection pooling
; This file provides connection pooling for PostgreSQL HA cluster

; General settings
pool_mode = transaction
default_pool_size = 20
max_client_conn = 100
reserve_pool_size = 5

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_statement = none

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/users.txt

; Database configuration
[databases]
; Langfuse database - read/write to primary, read-only to replicas
; Applications should connect to pgbouncer:6432
langfuse = host=pg-primary port=5432 dbname=langfuse

; Additional databases for future use
; warm = host=pg-warm port=5432 dbname=warm_store

; User settings for pooling
[users]
langfuse = pool_size=20
repmgr = pool_size=5

; System users
pgbouncer = pool_size=1

; Timeouts
server_idle_timeout = 3600
client_idle_timeout = 0
server_lifetime = 0
server_idle_transaction_timeout = 0
query_timeout = 0
idle_transaction_timeout = 0

; Performance settings
default_pool_size = 20
max_db_connections = 100
reserve_pool_size = 5

; SSL settings (disable for local testing)
client_tls_sslmode = disable
server_tls_sslmode = disable

; Unix socket settings
unix_socket_dir = /var/run/postgresql
unix_socket_mode = 0770

; Admin console settings
admin_users = pgbouncer
stats_period = 60

; Logging settings
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_statement = none
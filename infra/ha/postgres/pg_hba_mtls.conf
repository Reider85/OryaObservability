# mTLS host-based access for the HA Postgres cluster (PP02 / T3.0.2).
# Mounted via `-c hba_file=...` so initdb is not affected.
#
# - local (unix socket): trust — used by docker-entrypoint init and pg_isready
# - hostssl + cert: every TCP connection must present a client certificate
#   signed by the internal CA; with clientcert=verify-full the certificate CN
#   must equal the database user (CN=langfuse -> user langfuse,
#   CN=repmgr -> user repmgr).
local   all         all                 trust
hostssl all         all                 0.0.0.0/0    cert clientcert=verify-full
hostssl all         all                 ::/0         cert clientcert=verify-full
hostssl replication all                 0.0.0.0/0    cert clientcert=verify-full
hostssl replication all                 ::/0         cert clientcert=verify-full

# nginx load balancer for Langfuse with mTLS termination (PP02 / T3.0.2).
#
# - Public listener :3000 requires and verifies client certificates against
#   the internal CA (ssl_verify_client on). SDK / OTel-collector clients
#   present their mesh certs.
# - Localhost-only plaintext listener :3001 serves /nginx_status for
#   container healthchecks (no client cert available inside the probe).
# - Upstream langfuse nodes speak plain HTTP in-cluster: the Langfuse image
#   cannot terminate TLS itself (documented PP02 limitation).

events {
    worker_connections 1024;
}

http {
    upstream langfuse_backend {
        server langfuse-1:3000;
        server langfuse-2:3000;
        server langfuse-3:3000;

        # Health check
        health_check interval=30s timeout=3s;

        # Load balancing method
        least_conn;

        # Session affinity (sticky sessions for NextAuth)
        sticky;

        # Keepalive settings
        keepalive 32;
        keepalive_timeout 60;
        keepalive_requests 1000;
    }

    # Plaintext localhost health endpoint (no mTLS, loopback only)
    server {
        listen 127.0.0.1:3001;
        server_name localhost;

        location /nginx_status {
            stub_status on;
            access_log off;
        }
    }

    server {
        listen 3000 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/nginx-langfuse.pem;
        ssl_certificate_key /etc/nginx/certs/nginx-langfuse-key.pem;
        ssl_client_certificate /etc/nginx/certs/ca.pem;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Access logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Health check endpoint for Langfuse
        location /health {
            proxy_pass http://langfuse_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Health check specific settings
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        # Main application
        location / {
            proxy_pass http://langfuse_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
        }

        # Static files
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            proxy_pass http://langfuse_backend;
            proxy_set_header Host $host;
            proxy_cache_valid 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        }

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    }
}

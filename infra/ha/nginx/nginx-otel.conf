events {
    worker_connections 1024;
}

http {
    upstream otel_collector_backend {
        server otel-collector-1:4317;
        server otel-collector-2:4317;
        server otel-collector-3:4317;
        
        # Health check
        health_check interval=30s timeout=3s;
        
        # Load balancing method
        least_conn;
        
        # Keepalive settings
        keepalive 32;
        keepalive_timeout 60;
        keepalive_requests 1000;
    }
    
    server {
        listen 4317;
        server_name localhost;
        
        # Access logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        
        # Health check endpoint
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
        
        # Health check endpoint for OTel Collector
        location /health {
            proxy_pass http://otel_collector_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Health check specific settings
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
        
        # OTel gRPC endpoint
        location / {
            grpc_pass grpc://otel_collector_backend;
            
            # gRPC specific settings
            grpc_connect_timeout 5s;
            grpc_read_timeout 30s;
            grpc_send_timeout 30s;
            
            # CORS headers for HTTP/JSON fallback
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
        }
        
        # Metrics endpoint
        location /metrics {
            proxy_pass http://otel_collector_backend/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Metrics specific settings
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        
        # Debug endpoint
        location /debug {
            proxy_pass http://otel_collector_backend/debug;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
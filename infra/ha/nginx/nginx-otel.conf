# nginx load balancer for OTel collectors with full mTLS (PP02 / T3.0.2).
#
# - Public listeners :4317 (OTLP gRPC) and :4318 (OTLP HTTP) require and
#   verify client certificates against the internal CA.
# - Upstream collector connections are also mTLS (grpcs / https + proxy_ssl).
# - Localhost-only plaintext listener :4319 serves /nginx_status for
#   container healthchecks.

events {
    worker_connections 1024;
}

http {
    upstream otel_collector_grpc_backend {
        server otel-collector-1:4317;
        server otel-collector-2:4317;
        server otel-collector-3:4317;

        # Load balancing method
        least_conn;
        ip_hash;

        # Keepalive settings
        keepalive 32;
        keepalive_timeout 60;
        keepalive_requests 1000;
    }

    upstream otel_collector_http_backend {
        server otel-collector-1:4318;
        server otel-collector-2:4318;
        server otel-collector-3:4318;

        # Load balancing method
        least_conn;
        ip_hash;

        # Keepalive settings
        keepalive 32;
        keepalive_timeout 60;
        keepalive_requests 1000;
    }

    # Plaintext localhost health endpoint (no mTLS, loopback only)
    server {
        listen 127.0.0.1:4319;
        server_name localhost;

        location /nginx_status {
            stub_status on;
            access_log off;
        }
    }

    # OTLP HTTP (mTLS)
    server {
        listen 4318 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/nginx-otel.pem;
        ssl_certificate_key /etc/nginx/certs/nginx-otel-key.pem;
        ssl_client_certificate /etc/nginx/certs/ca.pem;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location / {
            proxy_pass https://otel_collector_http_backend;
            proxy_ssl_certificate /etc/nginx/certs/nginx-otel.pem;
            proxy_ssl_certificate_key /etc/nginx/certs/nginx-otel-key.pem;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca.pem;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name otel-collector-1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }

    # OTLP gRPC (mTLS)
    server {
        listen 4317 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/nginx-otel.pem;
        ssl_certificate_key /etc/nginx/certs/nginx-otel-key.pem;
        ssl_client_certificate /etc/nginx/certs/ca.pem;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location / {
            grpc_pass grpcs://otel_collector_grpc_backend;

            grpc_ssl_certificate /etc/nginx/certs/nginx-otel.pem;
            grpc_ssl_certificate_key /etc/nginx/certs/nginx-otel-key.pem;
            grpc_ssl_trusted_certificate /etc/nginx/certs/ca.pem;
            grpc_ssl_verify on;
            grpc_ssl_verify_depth 2;

            # gRPC specific settings
            grpc_connect_timeout 5s;
            grpc_read_timeout 30s;
            grpc_send_timeout 30s;
        }
    }
}

# Recording rules for tail-sampler observability (P21).
groups:
  - name: tail_sampler
    rules:
      # Доля сохранённых трейсов: kept / (kept + dropped).
      - record: job:tail_sampler_kept_ratio:ratio
        expr: |
          sum(otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled"})
          /
          (
            sum(otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled"})
            + sum(otelcol_processor_tail_sampling_count_traces_sampled{decision="dropped"})
          )
      # Причины срабатывания keep различимы по лейблу reason
      # (error-keep | cost-over-budget-keep | security-incident-keep | normal-sample).
      # `on() group_left` is required: the right-hand side aggregates to `{}`,
      # so default all-labels matching would drop every per-reason series.
      - record: job:tail_sampler_kept_by_reason:ratio
        expr: |
          sum by (reason) (
            otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled"}
          )
          /
          on() group_left
          sum(
            otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled"}
          )

  # PC21 (T2.3.5): the maintenance jobs must actually run. Each threshold is
  # 2 cycles, so a single slow or failed run does not page anyone.
  - name: cron
    rules:
      - alert: CronTargetDown
        expr: up{job="cron"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "cron maintenance service is not scrapeable"
          description: >-
            Prometheus has been unable to scrape cron:9777 for 5 minutes, so all
            tiered-retention jobs (vault TTL cleanup, audit archival, eval warm
            migration) have stopped. Restart the `cron` container.

      - alert: CronHourlyJobStale
        expr: |
          (time() - agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_vault"}) > 7200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "cleanup_vault has not succeeded for more than 2 hourly cycles"
          description: >-
            The hourly vault TTL cleanup last succeeded at
            {{ $value | humanizeDuration }} ago (threshold 2h). Expired PII
            vault entries are accumulating and their audit trail is being lost.

      - alert: CronDailyJobStale
        expr: |
          (
            time() - agent_obs_cron_last_success_timestamp_seconds{
              job_name=~"cleanup_audit_events|cleanup_eval_results"
            }
          ) > 172800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job_name }} has not succeeded for more than 2 daily cycles"
          description: >-
            Last successful run was {{ $value | humanizeDuration }} ago
            (threshold 48h). Audit events are past their 365-day retention
            window, or eval results are past their 14-day hot window, or spans
            are past their 14-day hot window, and the hot tier keeps growing past
            its ClickHouse TTL.

      - alert: CronWeeklyJobStale
        expr: |
          (time() - agent_obs_cron_last_success_timestamp_seconds{job_name="migrate_traces_to_cold"}) > 1209600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "migrate_traces_to_cold has not succeeded for more than 2 weekly cycles"
          description: >-
            Last successful run was {{ $value | humanizeDuration }} ago
            (threshold 14d). Traces are past their 90-day warm window and not
            being moved to cold storage, which will eventually fill the warm tier.

      - alert: ComplianceCatalogAggregationStale
        expr: |
          (time() - agent_obs_cron_last_success_timestamp_seconds{job_name="aggregate_compliance_catalog"}) > 172800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "aggregate_compliance_catalog has not succeeded for more than 2 daily cycles"
          description: >-
            Last successful run was {{ $value | humanizeDuration }} ago
            (threshold 48h). Compliance catalog aggregation is stale, so stale
            records are not being cleaned and views may be stale.

      - alert: ComplianceCatalogZeroActivity
        expr: increase(agent_obs_compliance_catalog_new_rows_24h[24h]) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "PII masking not working? Zero new catalog rows in 24h"
          description: >-
            No new compliance catalog rows in last 24 hours. Check guardrail
            functionality and agent traffic. This may indicate broken PII masking.

  # PC25/PC26/PC27: Drift detection via KL-divergence on response embeddings.
  # The gauge agent_obs_drift_kl_score is emitted by the out-of-process cron
  # drift detection script (scripts/cron/drift_detection.py) every 15 minutes.
  # The threshold gauge agent_obs_drift_threshold_value is updated by the
  # monthly calibration job (scripts/cron/calibrate_drift_threshold.py).
  # Alertmanager deduplicates via group_interval on the drift route (see
  # infra/alertmanager.yml).
  - name: drift-detection
    rules:
      - alert: DriftDetected
        expr: agent_obs_drift_kl_score > on(agent_id) agent_obs_drift_threshold_value
        for: 5m
        labels:
          severity: warning
          component: drift-detector
        annotations:
          summary: "Drift detected for agent {{ $labels.agent_id }}"
          description: >-
            KL-divergence {{ $value }} exceeds calibrated threshold for
            agent {{ $labels.agent_id }}. Investigate via Phoenix UMAP:
            http://phoenix:6006/datasets/latest/embeddings?agent={{ $labels.agent_id }}

  # PC32 (T2.7.4): the adaptive sampler must not sit forever at its lowest
  # rate. 0.05 is only correct while the host is saturated; if cpu_high
  # persists for half an hour the fix is capacity, not more sampling silence.
  # Kept in a separate group so the P21 tail_sampler recording-rule set
  # (asserted by tests/test_cron_jobs.py) stays untouched.
  - name: sampler-monitoring
    rules:
      - alert: SamplerRateStuckAtCpuHigh
        expr: agent_obs_tail_sampler_current_rate{policy_reason="cpu_high"} == 0.05
        for: 30m
        labels:
          severity: warning
          component: sampler
        annotations:
          summary: "tail sampler pinned at 5% (cpu_high) for over 30 minutes"
          description: >-
            agent_obs_tail_sampler_current_rate has been 0.05 with
            policy_reason=cpu_high for more than 30 minutes. System CPU has
            stayed above the policy threshold (default 0.8) the whole time, so
            the sampler is keeping only 5% of normal traces. Scale the host or
            investigate the load. Rate history: Grafana dashboard
            "Sampler Policy History" (http://localhost:3001/d/sampler-policy-history);
            audit rows via GET /audit/sampler-rate-history.

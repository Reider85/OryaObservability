# Recording rules for tail-sampler observability (P21).
groups:
  - name: tail_sampler
    rules:
      # Доля сохранённых трейсов: kept / (kept + dropped).
      - record: job:tail_sampler_kept_ratio:ratio
        expr: |
          sum(otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled"})
          /
          (
            sum(otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled"})
            + sum(otelcol_processor_tail_sampling_count_traces_sampled{decision="dropped"})
          )
      # Причины срабатывания keep различимы по лейблу reason
      # (error-keep | cost-over-budget-keep | security-incident-keep | normal-sample).
      # `on() group_left` is required: the right-hand side aggregates to `{}`,
      # so default all-labels matching would drop every per-reason series.
      - record: job:tail_sampler_kept_by_reason:ratio
        expr: |
          sum by (reason) (
            otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled"}
          )
          /
          on() group_left
          sum(
            otelcol_processor_tail_sampling_count_traces_sampled{decision="sampled"}
          )

  # PC21 (T2.3.5): the maintenance jobs must actually run. Each threshold is
  # 2 cycles, so a single slow or failed run does not page anyone.
  - name: cron
    rules:
      - alert: CronTargetDown
        expr: up{job="cron"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "cron maintenance service is not scrapeable"
          description: >-
            Prometheus has been unable to scrape cron:9777 for 5 minutes, so all
            tiered-retention jobs (vault TTL cleanup, audit archival, eval warm
            migration) have stopped. Restart the `cron` container.

      - alert: CronHourlyJobStale
        expr: |
          (time() - agent_obs_cron_last_success_timestamp_seconds{job_name="cleanup_vault"}) > 7200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "cleanup_vault has not succeeded for more than 2 hourly cycles"
          description: >-
            The hourly vault TTL cleanup last succeeded at
            {{ $value | humanizeDuration }} ago (threshold 2h). Expired PII
            vault entries are accumulating and their audit trail is being lost.

      - alert: CronDailyJobStale
        expr: |
          (
            time() - agent_obs_cron_last_success_timestamp_seconds{
              job_name=~"cleanup_audit_events|cleanup_eval_results|migrate_spans_to_warm"
            }
          ) > 172800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job_name }} has not succeeded for more than 2 daily cycles"
          description: >-
            Last successful run was {{ $value | humanizeDuration }} ago
            (threshold 48h). Audit events are past their 365-day retention
            window, or eval results are past their 14-day hot window, or spans
            are past their 14-day hot window, and the hot tier keeps growing past
            its ClickHouse TTL.

      # PC22: after the 3 retries (3x30min) inside one cycle have all failed,
      # page well before the 48h CronDailyJobStale threshold.
      - alert: CronMigrationHotToWarmFailed
        expr: increase(agent_obs_cron_errors_total{job_name="migrate_spans_to_warm"}[2h]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "migrate_spans_to_warm failed 3 times within 2h"
          description: >-
            The hot-to-warm migration exhausted its 3 retries (PC22: every 30
            minutes). Postgres warm is likely unreachable. Spans past their
            14-day hot window are accumulating in ClickHouse and will be lost
            once the hot TTL expires.

      - alert: CronWeeklyJobStale
        expr: |
          (time() - agent_obs_cron_last_success_timestamp_seconds{job_name="migrate_traces_to_cold"}) > 1209600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "migrate_traces_to_cold has not succeeded for more than 2 weekly cycles"
          description: >-
            Last successful run was {{ $value | humanizeDuration }} ago
            (threshold 14d). Traces are past their 90-day warm window and not
            being moved to cold storage, which will eventually fill the warm tier.

      - alert: ComplianceCatalogAggregationStale
        expr: |
          (time() - agent_obs_cron_last_success_timestamp_seconds{job_name="aggregate_compliance_catalog"}) > 172800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "aggregate_compliance_catalog has not succeeded for more than 2 daily cycles"
          description: >-
            Last successful run was {{ $value | humanizeDuration }} ago
            (threshold 48h). Compliance catalog aggregation is stale, so stale
            records are not being cleaned and views may be stale.

      - alert: ComplianceCatalogZeroActivity
        expr: increase(agent_obs_compliance_catalog_new_rows_24h[24h]) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "PII masking not working? Zero new catalog rows in 24h"
          description: >-
            No new compliance catalog rows in last 24 hours. Check guardrail
            functionality and agent traffic. This may indicate broken PII masking.

      # PC34: Weekly compliance catalog hot to warm migration
      - alert: ComplianceCatalogMigrationStale
        expr: time() - agent_obs_cron_last_success_timestamp_seconds{job_name="migrate_compliance_catalog_hot_to_warm"} > 1209600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Compliance catalog hot to warm migration has not succeeded for more than 2 weekly cycles"
          description: >-
            The weekly compliance catalog migration job has not succeeded for more than 2 cycles.
            This may indicate issues with ClickHouse or Postgres connectivity, or the job is taking
            longer than expected. Check the job logs and storage infrastructure.

  # PC25/PC26/PC27: Drift detection via KL-divergence on response embeddings.
  # The gauge agent_obs_drift_kl_score is emitted by the out-of-process cron
  # drift detection script (scripts/cron/drift_detection.py) every 15 minutes.
  # The threshold gauge agent_obs_drift_threshold_value is updated by the
  # monthly calibration job (scripts/cron/calibrate_drift_threshold.py).
  # Alertmanager deduplicates via group_interval on the drift route (see
  # infra/alertmanager.yml).
  - name: drift-detection
    rules:
      - alert: DriftDetected
        expr: agent_obs_drift_kl_score > on(agent_id) agent_obs_drift_threshold_value
        for: 5m
        labels:
          severity: warning
          component: drift-detector
        annotations:
          summary: "Drift detected for agent {{ $labels.agent_id }}"
          description: >-
            KL-divergence {{ $value }} exceeds calibrated threshold for
            agent {{ $labels.agent_id }}. Baseline window:
            {{ $labels.baseline_window_start }} - {{ $labels.baseline_window_end }}.
            Investigate via Phoenix UMAP:
            http://phoenix:6006/datasets/latest/embeddings?agent={{ $labels.agent_id }}

  # PC32 (T2.7.4): the adaptive sampler must not sit forever at its lowest
  # rate. 0.05 is only correct while the host is saturated; if cpu_high
  # persists for half an hour the fix is capacity, not more sampling silence.
  # Kept in a separate group so the P21 tail_sampler recording-rule set
  # (asserted by tests/test_cron_jobs.py) stays untouched.
  - name: sampler-monitoring
    rules:
      - alert: SamplerRateStuckAtCpuHigh
        expr: agent_obs_tail_sampler_current_rate{policy_reason="cpu_high"} == 0.05
        for: 30m
        labels:
          severity: warning
          component: sampler
        annotations:
          summary: "tail sampler pinned at 5% (cpu_high) for over 30 minutes"
          description: >-
            agent_obs_tail_sampler_current_rate has been 0.05 with
            policy_reason=cpu_high for more than 30 minutes. System CPU has
            stayed above the policy threshold (default 0.8) the whole time, so
            the sampler is keeping only 5% of normal traces. Scale the host or
            investigate the load. Rate history: Grafana dashboard
            "Sampler Policy History" (http://localhost:3001/d/sampler-policy-history);
            audit rows via GET /audit/sampler-rate-history.

      - alert: SamplerRateUnstable
        expr: sum(changes(agent_obs_tail_sampler_current_rate[10m])) > 5
        for: 5m
        labels:
          severity: warning
          component: sampler
        annotations:
          summary: "Sampler rate is unstable (>5 changes in 10m)"
          description: >-
            The sampling rate has changed more than 5 times in the last 10 minutes,
            indicating feedback loop instability. Check eval score stability and
            policy engine health. Current rate: {{ $value }} changes.

      - alert: SamplerDecisionLatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(tail_sampler_decision_latency_seconds_bucket[5m]))) > 0.005
        for: 5m
        labels:
          severity: warning
          component: sampler
        annotations:
          summary: "Sampler decision latency p99 > 5ms"
          description: >-
            The p99 latency of sampling policy decisions exceeds 5ms. This may
            impact throughput. Check policy engine complexity and optimize if needed.
            Current p99: {{ $value }} seconds.

  # PP11 (T3.2.4): span aggregation must not flush too frequently, which wastes
  # CPU and reduces the compression ratio. >0.2 means 1 aggregate per 5 spans
  # or less, indicating the buffer is too small or the agent is producing
  # micro-spans faster than expected.
  - name: span-aggregation
    rules:
      - alert: AggregationRatioTooLow
        expr: aggregation_ratio > 0.2
        for: 15m
        labels:
          severity: warning
          component: aggregation
        annotations:
          summary: "Aggregation ratio too high ({{ $value }} > 0.2)"
          description: >-
            The aggregation ratio (aggregated spans / micro-spans input) has been
            above 0.2 for 15 minutes. This indicates the aggregation buffer is
            flushing too frequently, reducing compression efficiency. Expected
            range is 0.02–0.05 (1 aggregate per 20–50 micro-spans). Check if the
            buffer size (max_count) is appropriate for your agent's reasoning
            step frequency. Dashboard: Span Aggregation
            (http://localhost:3001/d/span-aggregation); audit events via SDK logs.

  # PP13 (T3.3.2): nightly golden eval regression control. The gauge is set
  # once per nightly run by the nightly_golden_eval cron job and holds its
  # value between runs (long-lived cron scheduler keeps it scrapeable).
  - name: golden-eval
    rules:
      # Fires when the last run's pass rate is more than 0.10 below the mean
      # of everything Prometheus scraped over the trailing 7 days. A single
      # sample can never fire: current == avg(current), so current < current
      # - 0.10 is impossible; no separate "enough history" guard is needed.
      - alert: GoldenEvalRegression
        expr: |
          agent_obs_eval_golden_pass_rate
            < (avg_over_time(agent_obs_eval_golden_pass_rate[7d]) - 0.10)
        for: 5m
        labels:
          severity: warning
          component: golden-eval
        annotations:
          summary: "Golden eval pass rate regressed >10% below its 7-day average"
          description: >-
            The nightly golden eval pass rate is {{ $value }}, more than 0.10
            below the 7-day moving average. A recent agent, prompt, model or
            dependency change likely degraded answer quality. Root-cause rows:
            SELECT * FROM eval_golden_results WHERE pass = 0 ORDER BY nightly_ts
            DESC; runbook: docs/eval-golden-runbook.md.

      - alert: GoldenEvalJobStale
        expr: |
          (time() - agent_obs_cron_last_success_timestamp_seconds{job_name="nightly_golden_eval"}) > 172800
        for: 5m
        labels:
          severity: warning
          component: golden-eval
        annotations:
          summary: "nightly_golden_eval has not succeeded for more than 2 daily cycles"
          description: >-
            Last successful golden eval run was {{ $value | humanizeDuration }}
            ago (threshold 48h). Golden-set regression control is blind: either
            the cron job is broken, the LLM judge API is down, or ClickHouse
            writes are failing. Check cron logs and the
            agent_obs_cron_errors_total{job_name="nightly_golden_eval"} counter.

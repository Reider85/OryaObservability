name: orya-observability

# Shared environment for langfuse-web and langfuse-worker (Langfuse v3).
# v3 stores traces in ClickHouse and needs an S3-compatible bucket (MinIO)
# for event/media payloads; the v2 single-container image is gone.
x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${LANGFUSE_HOST:-http://localhost:3000}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-my-observability-session-secret}
  DATABASE_URL: ${DATABASE_URL:-postgresql://langfuse:langfuse@postgres:5432/langfuse}
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  TELEMETRY_ENABLED: "false"

  CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
  CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL:-clickhouse://clickhouse:9000}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
  CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED:-false}

  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_AUTH: ${REDIS_AUTH:-orya-local-redis-secret}

  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langfuse}
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    # No host port: postgres is internal to the compose network only.
    # Host 5432 is often occupied by a local Postgres (see infra/README.md).

  postgres-warm:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: warm
      POSTGRES_PASSWORD: warm
      POSTGRES_DB: warm_store
    volumes:
      - postgres_warm_data:/var/lib/postgresql/data
      - ./storage/postgres_warm.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./storage/postgres_warm_init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warm -d warm_store"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    # No host port, same as postgres above: the cron service reaches the warm
    # tier over the compose network. Publishing 5433 collides with unrelated
    # local Postgres instances.

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_AUTH:-orya-local-redis-secret} --maxmemory-policy noeviction
    environment:
      REDIS_AUTH: ${REDIS_AUTH:-orya-local-redis-secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_AUTH} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    # No host port: redis is internal to the compose network only.
    # Host 6379 is often occupied by a local Redis (see infra/README.md).

  eval-redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass ${EVAL_REDIS_AUTH:-eval-redis-secret} --maxmemory-policy noeviction --database 1
    environment:
      REDIS_AUTH: ${EVAL_REDIS_AUTH:-eval-redis-secret}
    volumes:
      - eval_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_AUTH} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    # Dedicated Redis instance for async eval jobs (separate from Langfuse)

  clickhouse:
    # Pinned: 26.9 verified live against this DDL (JSON columns, UUID,
    # DateTime64, TTL INTERVAL). Note Nullable(Array(...)) is illegal in
    # ClickHouse generally — spans_hot therefore has no response_embedding
    # column (see clickhouse_ddl.sql 1C comment).
    image: clickhouse/clickhouse-server:26.9
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # Mount name must match clickhouse_init.sh's default DDL_PATH.
      - ./storage/clickhouse_ddl.sql:/docker-entrypoint-initdb.d/clickhouse_ddl.sql:ro
      - ./storage/clickhouse_init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # App user for HotStore/drift/phoenix. Defined via XML because the
      # compose-provisioned `clickhouse` account has no CREATE USER grant.
      - ./storage/observability_user.xml:/etc/clickhouse-server/users.d/observability_user.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "8123:8123"  # HTTP — host tools / DoD verification
      # Native TCP on a free host port. Host :9000 is commonly occupied by an
      # unrelated MinIO/ClickHouse (other projects); publishing it here makes
      # this container fail to start. In-network clients use clickhouse:9000.
      - "9004:9000"

  # Always-runnable schema + app-user provisioning. The stock entrypoint only
  # executes /docker-entrypoint-initdb.d on an EMPTY data dir, so existing
  # volumes never get the observability DB/tables/users from the hook. This
  # one-shot is the supported re-apply path (same pattern as minio-init):
  #   docker compose run --rm clickhouse-init
  clickhouse-init:
    image: clickhouse/clickhouse-server:26.9
    restart: on-failure
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      # Admin account for DDL (same as the clickhouse service env). The app
      # user observability_user comes from users.d XML, not from SQL here.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      DDL_PATH: /init/clickhouse_ddl.sql
    volumes:
      - ./storage/clickhouse_ddl.sql:/init/clickhouse_ddl.sql:ro
      - ./storage/clickhouse_init.sh:/init/clickhouse_init.sh:ro
    entrypoint: ["/bin/bash", "/init/clickhouse_init.sh"]

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    # Pre-create the 'langfuse', 'cold-traces', and 'audit-events' buckets and apply lifecycle rules.
    command: -c 'mkdir -p /data/langfuse /data/cold-traces /data/audit-events && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
    volumes:
      - minio_data:/data
      - ./storage/minio_init.sh:/init/minio_init.sh:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # No host ports: Langfuse/cron/sampler talk to minio:9000 over the compose
    # network. Publishing 9000/9001 collides with unrelated local MinIO
    # instances (other projects), which prevents this container from starting
    # and surfaces as Langfuse ENOTFOUND minio. Console access:
    #   docker compose exec minio mc alias set local http://localhost:9000 minio <password>
    # or `docker compose port minio 9000` after a temporary override.

  langfuse:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *langfuse-env
      # First-boot provisioning (v3 only runs it when ORG_ID is set).
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-org-agent-obs}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Orya Observability}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-prj-agent-obs}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-agent-obs}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-your-public-key-here}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-your-secret-key-here}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-change-me-admin-password}
    ports:
      - "3000:3000"
    healthcheck:
      # v3's Next.js server binds to the container IP ($HOSTNAME), not loopback,
      # so probe the health endpoint via $HOSTNAME. Returns 503 until
      # Postgres/ClickHouse are migrated, 200 once ready.
      test: ["CMD", "node", "-e", "fetch('http://'+process.env.HOSTNAME+':3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *langfuse-env

  # One-shot bucket + lifecycle provisioning. Must be a separate service: the
  # MinIO image has no entrypoint init hook, and minio_init.sh blocks until
  # MinIO answers, so it cannot be chained into the minio command.
  # The audit-events bucket must keep objects 365 days (§3.4 ARCHITECT.md:
  # audit retention is at least 1 year) — PC21 archives into it.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
    volumes:
      - ./storage/minio_init.sh:/init/minio_init.sh:ro
    entrypoint: ["/bin/sh", "/init/minio_init.sh"]
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    restart: unless-stopped
    depends_on:
      langfuse:
        condition: service_healthy
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://localhost:3000}
      TAIL_SAMPLER_NORMAL_RATE: ${TAIL_SAMPLER_NORMAL_RATE:-10}
      TAIL_SAMPLER_COST_THRESHOLD: ${TAIL_SAMPLER_COST_THRESHOLD:-0.05}
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"

  # PC30: adaptive tail-sampler proxy. The Collector interpolates
  # ${env:TAIL_SAMPLER_NORMAL_RATE} once at start and has no admin API, so the
  # normal-trace rate cannot be changed without a restart. The proxy holds the
  # rate in memory and swaps it on a lock; the policy engine pushes a new value
  # every 30s from the PC29 gauges. See scripts/sampler/README.md.
  sampler-proxy:
    build:
      context: ..
      dockerfile: scripts/sampler/Dockerfile
      # HTTP-only image. The last stage in the Dockerfile carries grpcio for the
      # optional OTLP/gRPC receiver, and Docker builds the last stage when no
      # target is given — so name the base stage explicitly to keep it out.
      target: sampler-base
    image: agent-obs-sampler:latest
    restart: unless-stopped
    depends_on:
      langfuse:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      # Where kept traces are forwarded. Set to the collector instead of
      # Langfuse to keep the Collector in the trace path.
      DOWNSTREAM_URL: ${SAMPLER_DOWNSTREAM_URL:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      AGENT_OBS_TLS_CA: ${AGENT_OBS_TLS_CA:-}
      # Read the PC29 gauges from here.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      AGENT_OBS_SAMPLER_MODE: ${AGENT_OBS_SAMPLER_MODE:-proxy}
      AGENT_OBS_SAMPLER_POLL_INTERVAL: ${AGENT_OBS_SAMPLER_POLL_INTERVAL:-30}
      AGENT_OBS_SAMPLER_CPU_THRESHOLD: ${AGENT_OBS_SAMPLER_CPU_THRESHOLD:-0.8}
      AGENT_OBS_SAMPLER_ERROR_THRESHOLD: ${AGENT_OBS_SAMPLER_ERROR_THRESHOLD:-0.05}
      SAMPLER_PROXY_PORT_GRPC: ${AGENT_OBS_SAMPLER_PROXY_PORT_GRPC:-4320}
      SAMPLER_PROXY_PORT_HTTP: ${AGENT_OBS_SAMPLER_PROXY_PORT_HTTP:-4321}
      # 9095, not 9091 — Prometheus already publishes 9091.
      SAMPLER_PROXY_METRICS_PORT: ${AGENT_OBS_SAMPLER_PROXY_METRICS_PORT:-9095}
      SAMPLER_RATE_FILE: ${SAMPLER_RATE_FILE:-/shared/sampler_rate.json}
      AGENT_OBS_LOG_LEVEL: ${AGENT_OBS_LOG_LEVEL:-INFO}
      # Audit writes for rate changes (PC30) go to the ClickHouse hot store.
      # Credentials must match the clickhouse service provisioning.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-observability}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - ../:/app:ro
      - sampler_shared:/shared
    ports:
      - "4321:4321"  # OTLP/HTTP — point LANGFUSE_HOST here in proxy mode
      # 9095 serves /metrics only (prometheus_client). GET /sampler/status
      # is on the OTLP/HTTP port above (:4321).
      - "9095:9095"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9095/metrics', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    cap_add: ["IPC_LOCK"]
    ports:
      - "8200:8200"
    environment:
      VAULT_LOCAL_CONFIG: '{"storage":{"file":{"path":"/vault/data"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},"default_lease_ttl":"24h","max_lease_ttl":"24h","ui":true}'
    volumes:
      - vault_data:/vault/data
      - ./vault/policies:/vault/policies:ro
      - ./vault/vault_init.sh:/vault/vault_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "vault status -format=json || true"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  eval-worker:
    image: eval-worker:latest
    restart: unless-stopped
    depends_on:
      eval-redis:
        condition: service_healthy
    environment:
      EVAL_REDIS_URL: redis://eval-redis:6379/1
      EVAL_QUEUE_NAME: eval-queue
      EVAL_WORKER_CONCURRENCY: 4
      LLM_JUDGE_MODEL: gpt-4o-mini
      LLM_JUDGE_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: text-embedding-3-small
      PYTHONPATH: /app
    volumes:
      - ../:/app:ro
    command: >
      sh -c "cd /app && 
             python -m rq worker eval-queue \
             --url redis://eval-redis:6379/1 \
             --worker-class 'rq.worker.SimpleWorker' \
             --name eval-worker-1"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8777/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    scale: 2
    expose:
      - "8777"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    depends_on:
      - otel-collector
      - cron
      - alertmanager
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9091:9090"

  # PC21: tiered-retention maintenance jobs. Separate process from the SDK and
  # from the agent — it only reaches the storage backends directly.
  # Prometheus scrapes :9777/metrics; "missed run" alerts live in prometheus-rules.yml.
  cron:
    build:
      context: ..
      dockerfile: infra/cron/Dockerfile
    image: agent-obs-cron:latest
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres-warm:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      # Schedule (5-field cron, evaluated in UTC)
      AGENT_OBS_CRON_VAULT_SPEC: ${AGENT_OBS_CRON_VAULT_SPEC:-0 * * * *}
      AGENT_OBS_CRON_AUDIT_SPEC: ${AGENT_OBS_CRON_AUDIT_SPEC:-17 3 * * *}
      AGENT_OBS_CRON_EVAL_SPEC: ${AGENT_OBS_CRON_EVAL_SPEC:-47 3 * * *}
      AGENT_OBS_CRON_MIGRATION_SPEC: ${AGENT_OBS_CRON_MIGRATION_SPEC:-0 4 * * *}
      AGENT_OBS_CRON_COLD_SPEC: ${AGENT_OBS_CRON_COLD_SPEC:-17 4 * * 0}
      AGENT_OBS_CRON_PORT: ${AGENT_OBS_CRON_PORT:-9777}
      # Retention windows (must match the ClickHouse TTLs)
      AGENT_OBS_CRON_AUDIT_RETENTION_DAYS: ${AGENT_OBS_CRON_AUDIT_RETENTION_DAYS:-365}
      AGENT_OBS_CRON_EVAL_RETENTION_DAYS: ${AGENT_OBS_CRON_EVAL_RETENTION_DAYS:-14}
      AGENT_OBS_CRON_MIGRATION_RETENTION_DAYS: ${AGENT_OBS_CRON_MIGRATION_RETENTION_DAYS:-14}
      AGENT_OBS_CRON_COLD_RETENTION_DAYS: ${AGENT_OBS_CRON_COLD_RETENTION_DAYS:-90}
      AGENT_OBS_CRON_BATCH_SIZE: ${AGENT_OBS_CRON_BATCH_SIZE:-10000}
      AGENT_OBS_CRON_MAX_EVENTS: ${AGENT_OBS_CRON_MAX_EVENTS:-1000}
      AGENT_OBS_CRON_MAX_PARTITION_ROWS: ${AGENT_OBS_CRON_MAX_PARTITION_ROWS:-200000}
      # KV v2 has no server-side TTL, so nothing reclaims expired entries on its
      # own. Off by default because PC21 assigns reclamation to Vault.
      AGENT_OBS_CRON_VAULT_DELETE_EXPIRED: ${AGENT_OBS_CRON_VAULT_DELETE_EXPIRED:-false}
      AGENT_OBS_LOG_LEVEL: ${AGENT_OBS_LOG_LEVEL:-INFO}
      # Backends. The ClickHouse credentials must be the *same* variables the
      # clickhouse service is provisioned with, otherwise every job fails with
      # "there is no user with such name".
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-observability}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      WARM_PG_DSN: ${WARM_PG_DSN:-postgresql://warm:warm@postgres-warm:5432/warm_store}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
      S3_AUDIT_BUCKET: ${S3_AUDIT_BUCKET:-audit-events}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
    volumes:
      - ../:/app:ro
    ports:
      - "9777:9777"  # metrics endpoint, exposed for DoD verification
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9777/metrics', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # PC21: Prometheus alert receiver. PC27 assumed this already existed; the
  # cron staleness alerts need it to be routed anywhere.
  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  # PC28: Arize Phoenix self-hosted for UMAP embedding visualization.
  # Used by drift detector (PC25-PC27) for root-cause analysis.
  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    environment:
      PHOENIX_PORT: "6006"
      PHOENIX_HOST: "0.0.0.0"
      PHOENIX_SQLITE_DATABASE_PATH: /data/phoenix.db
    volumes:
      - phoenix_data:/data
    ports:
      - "6006:6006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # PC32 (T2.7.4): minimal "Sampler Policy History" dashboard. Prometheus is
  # the only datasource; the dashboard is provisioned from
  # infra/grafana/dashboards/ (no manual import). Host port 3001 — Langfuse
  # already publishes host :3000.
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  postgres_warm_data:
  redis_data:
  eval_redis_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  vault_data:
  phoenix_data:
  sampler_shared:
  grafana_data:

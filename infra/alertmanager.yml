# Alertmanager routing for the observability stack (PC21).
#
# Prometheus sends firing alerts here via the `alerting:` block in
# prometheus.yml. The default receiver is a `null` receiver: the local stack has
# no notification destination, and dropping the alert is preferable to failing
# the Prometheus evaluation. Replace `null` with a real receiver before relying
# on the cron staleness alerts outside development.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, job_name]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # PC27: drift-detection alerts are grouped per agent and suppressed for 30
    # minutes so that a sustained drift does not flood the on-call channel.
    # The 5m `for:` in the Prometheus rule already debounces the first fire;
    # group_interval here provides the 30-min dedup window.
    - matchers:
        - component="drift-detector"
      receiver: slack
      group_by: [alertname, agent_id]
      group_wait: 30s
      group_interval: 30m
      repeat_interval: 2h

    # PC27: critical alerts go to Slack for on-call response.
    - matchers:
        - severity="critical"
      receiver: slack
      group_wait: 10s
      repeat_interval: 1h

    # PP26: SLO fast-burn page alerts wake the on-call via PagerDuty.
    # PAGERDUTY_SERVICE_KEY must be set in infra/.env (see .env.example);
    # without it alerts here are dropped like the default receiver.
    - matchers:
        - severity="page"
      receiver: pagerduty
      group_by: [alertname, slo]
      group_wait: 10s
      repeat_interval: 1h

    # PP26: SLO slow-burn ticket alerts go to the issue tracker (Jira
    # incoming webhook). No paging — next business day is fine.
    - matchers:
        - severity="ticket"
      receiver: jira
      group_by: [alertname, slo]
      group_wait: 5m
      repeat_interval: 12h

inhibit_rules:
  # While the cron target is down, Prometheus sees no cron metrics at all, so the
  # staleness alerts stay silent. One noisy "target down" is enough.
  - source_matchers:
      - alertname="CronTargetDown"
    target_matchers:
      - alertname=~"Cron(Hourly|Daily)JobStale"

receivers:
  - name: default
    # No notification channel configured. Until SLACK_WEBHOOK_URL is set in
    # infra/.env, alerts here are silently dropped (cron staleness alerts only).

  - name: slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "${SLACK_CHANNEL:-#test-drift}"
        title: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})"
        text: >-
          {{ range .Alerts }}
          Agent: {{ .Labels.agent_id }}
          KL: {{ .Annotations.description }}
          Baseline window: {{ .Labels.baseline_window_start }} - {{ .Labels.baseline_window_end }}
          {{ end }}
        send_resolved: true

  # PP26: PagerDuty receiver for severity="page" SLO burn-rate alerts.
  # Set PAGERDUTY_SERVICE_KEY in infra/.env before relying on it.
  - name: pagerduty
    pagerduty_configs:
      - service_key: "${PAGERDUTY_SERVICE_KEY}"
        severity: critical
        summary: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.slo }})"

  # PP26: Jira incoming-webhook receiver for severity="ticket" SLO burn-rate
  # alerts. Set JIRA_WEBHOOK_URL in infra/.env (e.g. a automation rule
  # webhook that creates a ticket). No paging.
  - name: jira
    webhook_configs:
      - url: "${JIRA_WEBHOOK_URL}"
        send_resolved: true

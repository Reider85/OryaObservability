[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[rqevalworker]
command=rq worker eval-queue --url redis://eval-redis:6379/1 --worker-class 'rq.worker.SimpleWorker' --name eval-worker-1
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/app
autostart=true
autorestart=true
startretries=3
stopwaitsecs=3600
user=root
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
environment=EVAL_REDIS_URL="redis://eval-redis:6379/1",EVAL_QUEUE_NAME="eval-queue",EVAL_WORKER_CONCURRENCY="4",LLM_JUDGE_MODEL="gpt-4o-mini",LLM_JUDGE_API_KEY="$LLM_JUDGE_API_KEY",EMBEDDING_MODEL="text-embedding-3-small"

[httpserver]
command=python -m http.server 8777 --bind 0.0.0.0
directory=/app
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
autostart=true
autorestart=true
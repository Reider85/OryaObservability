# Prometheus scrape config for the OTel Collector self-telemetry (P21).
#
# The tail sampler exposes native Counter metrics and the recording rule below
# derives tail_sampler_kept_ratio = kept / (kept + dropped).
#
# PC21 adds a second target: the cron maintenance service on :9777, which is
# the only in-process component whose agent_obs_* metrics are actually
# scrapeable today (see the cron staleness alerts in prometheus-rules.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: cron
    static_configs:
      - targets: ["cron:9777"]

        condition: service_healthy
    environment:
      VAULT_TOKEN: ${VAULT_TRANSIT_TOKEN:-vault-transit-token}
      VAULT_ADDR: https://localhost:8200
      VAULT_API_ADDR: https://vault-3:8200
      VAULT_CACERT: /vault/certs/ca.pem

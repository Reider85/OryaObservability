  # --- Vault HA: 3-node raft + auto-unseal via transit (PP37) ---
  vault-unseal:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    cap_add: ["IPC_LOCK"]
    depends_on:
      certs-init:
        condition: service_completed_successfully
    environment:
      # mTLS listener (PP02): the transit vault also requires client certs
      VAULT_LOCAL_CONFIG: '{"storage":{"file":{"path":"/vault/data"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_cert_file":"/vault/certs/vault-unseal.pem","tls_key_file":"/vault/certs/vault-unseal-key.pem","tls_ca_cert_file":"/vault/certs/ca.pem","tls_disable_client_certs":false,"require_request_client_cert":true}},"default_lease_ttl":"24h","max_lease_ttl":"24h","ui":true}'
      VAULT_ADDR: https://localhost:8200
      VAULT_CACERT: /vault/certs/ca.pem
      VAULT_CLIENT_CERT: /vault/certs/vault-unseal.pem
      VAULT_CLIENT_KEY: /vault/certs/vault-unseal-key.pem
    volumes:
      - vault_unseal_data:/vault/data
      - ./ha/vault/unseal-init.sh:/vault/unseal-init.sh:ro
      - certs_vault_unseal:/vault/certs:ro
    healthcheck:
      # exit 0 = initialized+unsealed (rc 2 means sealed — not healthy yet)
      test: ["CMD-SHELL", "vault status -format=json >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    # Bootstrap runs once and exits 0; keep the container alive afterwards so
    # a compose restart does not re-run init against a live cluster.
    command: >
      sh -c "/vault/unseal-init.sh && exec tail -f /dev/null"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  vault-1:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    cap_add: ["IPC_LOCK"]
    depends_on:
      certs-init:
        condition: service_completed_successfully
      vault-unseal:
        condition: service_healthy
    environment:
      # VAULT_TOKEN is read by the transit seal block (never in mounted HCL)
      VAULT_TOKEN: ${VAULT_TRANSIT_TOKEN:-vault-transit-token}
      VAULT_ADDR: https://localhost:8200
      VAULT_API_ADDR: https://vault-1:8200
      VAULT_CACERT: /vault/certs/ca.pem
      VAULT_CLIENT_CERT: /vault/certs/vault.pem
      VAULT_CLIENT_KEY: /vault/certs/vault-key.pem
    volumes:
      - vault_1_data:/vault/data
      # Static per-node config: Vault HCL does not expand ${VAR:-default}
      - ./ha/vault/vault-raft-1.hcl:/vault/config/vault-raft.hcl:ro
      - certs_vault:/vault/certs:ro
    command: server -config=/vault/config/vault-raft.hcl
    healthcheck:
      # rc 0 = initialized+unsealed; rc 2 = sealed (waiting for transit)
      test: ["CMD-SHELL", "vault status -format=json >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "8210:8200"
    networks:
      default:
        aliases:
          - vault.observability.local
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  vault-2:
    image: hashicorp/vault:1.18
    restart: unless-stopped

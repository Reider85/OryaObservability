name: orya-observability-ha

# Production-ready HA stack with multi-AZ replicas and automatic failover
# Uses docker-compose deploy.replicas for 3× services, separate infrastructure from base stack
# Run: docker compose -f docker-compose.ha.yml up -d

# Shared environment for langfuse-web and langfuse-worker (Langfuse v3 HA)
x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${LANGFUSE_HOST:-https://localhost:3000}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-my-observability-session-secret}
  # mTLS (PP02): Prisma connects to Postgres with the langfuse mesh cert
  # (CN=langfuse matches the database role under `cert clientcert=verify-full`)
  DATABASE_URL: "${DATABASE_URL:-postgresql://langfuse:langfuse@pg-primary:5432/langfuse?sslmode=verify-full&sslrootcert=/var/lib/postgresql/certs/ca.pem&sslcert=/var/lib/postgresql/certs/langfuse.pem&sslkey=/var/lib/postgresql/certs/langfuse-key.pem}"
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  TELEMETRY_ENABLED: "false"

  # ClickHouse cluster for HA replication
  CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse1:8123}
  CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL:-clickhouse://clickhouse1:9000}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
  CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED:-true}

  # Redis Sentinel for HA
  REDIS_HOST: ${REDIS_HOST:-redis-master}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_AUTH: ${REDIS_AUTH:-orya-local-redis-secret}

  # S3-compatible storage for Langfuse (MinIO distributed HA)
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  # --- mTLS material: populate per-service cert volumes once (PP02) ---
  certs-init:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ./ha/certs:/src/certs:ro
      - ./ha/certs-init.sh:/usr/local/bin/certs-init.sh:ro
      - certs_postgres:/volumes/certs_postgres
      - certs_pgbouncer:/volumes/certs_pgbouncer
      - certs_redis:/volumes/certs_redis
      - certs_vault:/volumes/certs_vault
      - certs_vault_unseal:/volumes/certs_vault_unseal
      - certs_clickhouse:/volumes/certs_clickhouse
      - certs_nginx:/volumes/certs_nginx
      - certs_otel:/volumes/certs_otel
      - certs_langfuse:/volumes/certs_langfuse
      - certs_sdk:/volumes/certs_sdk
    entrypoint: ["/bin/sh", "/usr/local/bin/certs-init.sh"]

  # --- ClickHouse HA: 2 shards × 2 replicas + Keeper quorum ---
  clickhouse1:
    # Pinned: 26.9 verified live against this DDL (JSON columns, UUID,
    # DateTime64, TTL INTERVAL). PC24: embeddings stored in span_embeddings
    # sidecar table (see clickhouse_ddl_ha.sql); spans_hot.response_embedding kept
    # for compatibility. Run docker compose run --rm clickhouse-init-ha to heal
    # existing volumes with ALTER migrations.
    image: clickhouse/clickhouse-server:26.9
    restart: unless-stopped
    user: "101:101"
    depends_on:
      certs-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - clickhouse_data1:/var/lib/clickhouse
      - clickhouse_logs1:/var/log/clickhouse-server
      # mTLS: HTTPS/native-secure ports with verified client certs (PP02)
      - ./ha/clickhouse-tls.xml:/etc/clickhouse-server/config.d/tls.xml:ro
      - certs_clickhouse:/etc/clickhouse-server/certs:ro
      # HA DDL with ReplicatedMergeTree engines
      - ./storage/clickhouse_ddl_ha.sql:/docker-entrypoint-initdb.d/clickhouse_ddl.sql:ro
      - ./storage/clickhouse_init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # Cluster config for shard 1, replica 1
      - ./ha/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      # PP35: shard/replica macros — required for ReplicatedMergeTree {shard}/{replica}
      - ./ha/clickhouse-macros1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./storage/observability_user.xml:/etc/clickhouse-server/users.d/observability_user.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "8123:8123"  # HTTP — host tools / DoD verification
      - "9001:9000"  # Native TCP (not 9000 to avoid conflicts)
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  clickhouse2:
    image: clickhouse/clickhouse-server:26.9
    restart: unless-stopped
    user: "101:101"
    depends_on:
      certs-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_SHARD_NUM: 1
      CLICKHOUSE_REPLICA_NUM: 2
    volumes:
      - clickhouse_data2:/var/lib/clickhouse
      - clickhouse_logs2:/var/log/clickhouse-server
      # mTLS: HTTPS/native-secure ports with verified client certs (PP02)
      - ./ha/clickhouse-tls.xml:/etc/clickhouse-server/config.d/tls.xml:ro
      - certs_clickhouse:/etc/clickhouse-server/certs:ro
      # HA DDL with ReplicatedMergeTree engines
      - ./storage/clickhouse_ddl_ha.sql:/docker-entrypoint-initdb.d/clickhouse_ddl.sql:ro
      - ./storage/clickhouse_init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # Cluster config for shard 1, replica 2
      - ./ha/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      # PP35: shard/replica macros — required for ReplicatedMergeTree {shard}/{replica}
      - ./ha/clickhouse-macros2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./storage/observability_user.xml:/etc/clickhouse-server/users.d/observability_user.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "8124:8123"  # HTTP — host tools / DoD verification
      - "9002:9000"  # Native TCP
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  clickhouse3:
    image: clickhouse/clickhouse-server:26.9
    restart: unless-stopped
    user: "101:101"
    depends_on:
      certs-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_SHARD_NUM: 2
      CLICKHOUSE_REPLICA_NUM: 1
    volumes:
      - clickhouse_data3:/var/lib/clickhouse
      - clickhouse_logs3:/var/log/clickhouse-server
      # mTLS: HTTPS/native-secure ports with verified client certs (PP02)
      - ./ha/clickhouse-tls.xml:/etc/clickhouse-server/config.d/tls.xml:ro
      - certs_clickhouse:/etc/clickhouse-server/certs:ro
      # HA DDL with ReplicatedMergeTree engines
      - ./storage/clickhouse_ddl_ha.sql:/docker-entrypoint-initdb.d/clickhouse_ddl.sql:ro
      - ./storage/clickhouse_init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # Cluster config for shard 2, replica 1
      - ./ha/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      # PP35: shard/replica macros — required for ReplicatedMergeTree {shard}/{replica}
      - ./ha/clickhouse-macros3.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./storage/observability_user.xml:/etc/clickhouse-server/users.d/observability_user.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "8125:8123"  # HTTP — host tools / DoD verification
      - "9003:9000"  # Native TCP
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  clickhouse4:
    image: clickhouse/clickhouse-server:26.9
    restart: unless-stopped
    user: "101:101"
    depends_on:
      certs-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_SHARD_NUM: 2
      CLICKHOUSE_REPLICA_NUM: 2
    volumes:
      - clickhouse_data4:/var/lib/clickhouse
      - clickhouse_logs4:/var/log/clickhouse-server
      # mTLS: HTTPS/native-secure ports with verified client certs (PP02)
      - ./ha/clickhouse-tls.xml:/etc/clickhouse-server/config.d/tls.xml:ro
      - certs_clickhouse:/etc/clickhouse-server/certs:ro
      # HA DDL with ReplicatedMergeTree engines
      - ./storage/clickhouse_ddl_ha.sql:/docker-entrypoint-initdb.d/clickhouse_ddl.sql:ro
      - ./storage/clickhouse_init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      # Cluster config for shard 2, replica 2
      - ./ha/clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      # PP35: shard/replica macros — required for ReplicatedMergeTree {shard}/{replica}
      - ./ha/clickhouse-macros4.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./storage/observability_user.xml:/etc/clickhouse-server/users.d/observability_user.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "8126:8123"  # HTTP — host tools / DoD verification
      - "9004:9000"  # Native TCP
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # ClickHouse Keeper quorum (3 nodes, PP35)
  # Each node MUST mount its own config: raft server_id must be unique (1/2/3),
  # a shared server_id=1 config prevents the quorum from forming.
  clickhouse-keeper1:
    image: clickhouse/clickhouse-server:26.9
    restart: unless-stopped
    user: "101:101"
    command: clickhouse-keeper --config /etc/clickhouse-server/config.d/keeper.xml
    volumes:
      - keeper_data1:/var/lib/clickhouse/keeper
      - ./ha/keeper1.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    healthcheck:
      # "srvr" round-trips the keeper client against the local raft listener —
      # a dead/unelected keeper fails here, a mere config check would not.
      test: ["CMD-SHELL", "clickhouse-keeper-client --host 127.0.0.1 --port 9181 --query srvr"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  clickhouse-keeper2:
    image: clickhouse/clickhouse-server:26.9
    restart: unless-stopped
    user: "101:101"
    command: clickhouse-keeper --config /etc/clickhouse-server/config.d/keeper.xml
    volumes:
      - keeper_data2:/var/lib/clickhouse/keeper
      - ./ha/keeper2.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-keeper-client --host 127.0.0.1 --port 9181 --query srvr"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  clickhouse-keeper3:
    image: clickhouse/clickhouse-server:26.9
    restart: unless-stopped
    user: "101:101"
    command: clickhouse-keeper --config /etc/clickhouse-server/config.d/keeper.xml
    volumes:
      - keeper_data3:/var/lib/clickhouse/keeper
      - ./ha/keeper3.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-keeper-client --host 127.0.0.1 --port 9181 --query srvr"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # HA initialization for ClickHouse schema
  clickhouse-init-ha:
    image: clickhouse/clickhouse-server:26.9
    restart: on-failure
    depends_on:
      clickhouse1:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy
      clickhouse3:
        condition: service_healthy
      clickhouse4:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse1
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_HOST2: clickhouse2
      CLICKHOUSE_PORT2: "9000"
      CLICKHOUSE_HOST3: clickhouse3
      CLICKHOUSE_PORT3: "9000"
      CLICKHOUSE_HOST4: clickhouse4
      CLICKHOUSE_PORT4: "9000"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      DDL_PATH: /init/clickhouse_ddl_ha.sql
    volumes:
      - ./storage/clickhouse_ddl_ha.sql:/init/clickhouse_ddl_ha.sql:ro
      - ./storage/clickhouse_init.sh:/init/clickhouse_init.sh:ro
      - ./ha/clickhouse-cluster.xml:/init/cluster.xml:ro
    entrypoint: ["/bin/bash", "/init/clickhouse_init.sh"]

  # --- Postgres HA: 1 primary + 2 replicas + repmgr + pgBouncer ---
  pg-primary:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      certs-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langfuse}
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
      REPMGR_PRIMARY: "true"
      REPMGR_PARTNER_NODES: "pg-primary,pg-replica-1,pg-replica-2"
      REPMGR_NODE_NAME: "pg-primary"
      REPMGR_HOST: pg-primary
      REPMGR_PORT: 5432
      REPMGR_USER: repmgr
      REPMGR_PASSWORD: ${REPMGR_PASSWORD:-repmgr}
      REPMGR_CONNECT_TIMEOUT: 2
      REPMGR_RECONNECT_ATTEMPTS: 3
      REPMGR_RECONNECT_INTERVAL: 5
      REPMGR_SERVICE: "primary"
      REPMGR_DATA_DIRECTORY: "/var/lib/postgresql/data"
      REPMGR_LOG_LEVEL: INFO
      # mTLS client identity for repmgr/libpq connections (PP02): CN=repmgr
      # matches the database role required by `cert clientcert=verify-full`
      PGSSLROOTCERT: /var/lib/postgresql/certs/ca.pem
      PGSSLCERT: /var/lib/postgresql/certs/repmgr.pem
      PGSSLKEY: /var/lib/postgresql/certs/repmgr-key.pem
    entrypoint: /ha/postgres/docker-entrypoint-ha.sh
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/certs/postgres.pem
      - -c
      - ssl_key_file=/var/lib/postgresql/certs/postgres-key.pem
      - -c
      - ssl_ca_file=/var/lib/postgresql/certs/ca.pem
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=3
      - -c
      - max_replication_slots=3
      - -c
      - hot_standby=on
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./ha/postgres/docker-entrypoint-ha.sh:/ha/postgres/docker-entrypoint-ha.sh:ro
      - ./ha/postgres/repmgr-node1.conf:/etc/repmgr.conf:ro
      # mTLS (PP02): server cert + cert-only pg_hba
      - ./ha/postgres/pg_hba_mtls.conf:/etc/postgresql/pg_hba.conf:ro
      - certs_postgres:/var/lib/postgresql/certs:ro
      # Shared volume for pgbouncer dynamic config
      - pgbouncer_dynamic:/var/lib/postgresql/pgbouncer-dynamic
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ports:
      - "5433:5432"  # Primary accessible directly (not recommended for production)
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  pg-replica-1:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      certs-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langfuse}
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
      REPMGR_PRIMARY: "false"
      REPMGR_PARTNER_NODES: "pg-primary,pg-replica-1,pg-replica-2"
      REPMGR_NODE_NAME: "pg-replica-1"
      REPMGR_HOST: pg-replica-1
      REPMGR_PORT: 5432
      REPMGR_USER: repmgr
      REPMGR_PASSWORD: ${REPMGR_PASSWORD:-repmgr}
      REPMGR_CONNECT_TIMEOUT: 2
      REPMGR_RECONNECT_ATTEMPTS: 3
      REPMGR_RECONNECT_INTERVAL: 5
      REPMGR_SERVICE: "standby"
      REPMGR_DATA_DIRECTORY: "/var/lib/postgresql/data"
      REPMGR_LOG_LEVEL: INFO
      # Streaming replication config
      POSTGRES_REPLICATION_USER: repmgr
      POSTGRES_REPLICATION_PASSWORD: ${REPMGR_PASSWORD:-repmgr}
      POSTGRES_PRIMARY_CONNINFO: "host=pg-primary port=5432 user=repmgr password=${REPMGR_PASSWORD:-repmgr} dbname=${POSTGRES_DB:-langfuse}"
# mTLS client identity for repmgr/libpq connections (PP02)
      PGSSLROOTCERT: /var/lib/postgresql/certs/ca.pem
      PGSSLCERT: /var/lib/postgresql/certs/repmgr.pem
      PGSSLKEY: /var/lib/postgresql/certs/repmgr-key.pem
    entrypoint: /ha/postgres/docker-entrypoint-ha.sh
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/certs/postgres.pem
      - -c
      - ssl_key_file=/var/lib/postgresql/certs/postgres-key.pem
      - -c
      - ssl_ca_file=/var/lib/postgresql/certs/ca.pem
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=3
      - -c
      - max_replication_slots=3
      - -c
      - hot_standby=on
    volumes:
      - postgres_replica1_data:/var/lib/postgresql/data
      - ./ha/postgres/docker-entrypoint-ha.sh:/ha/postgres/docker-entrypoint-ha.sh:ro
      - ./ha/postgres/repmgr-node2.conf:/etc/repmgr.conf:ro
      # mTLS (PP02): server cert + cert-only pg_hba
      - ./ha/postgres/pg_hba_mtls.conf:/etc/postgresql/pg_hba.conf:ro
      - certs_postgres:/var/lib/postgresql/certs:ro
      # Shared volume for pgbouncer dynamic config
      - pgbouncer_dynamic:/var/lib/postgresql/pgbouncer-dynamic
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  pg-replica-2:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      certs-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langfuse}
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
      REPMGR_PRIMARY: "false"
      REPMGR_PARTNER_NODES: "pg-primary,pg-replica-1,pg-replica-2"
      REPMGR_NODE_NAME: "pg-replica-2"
      REPMGR_HOST: pg-replica-2
      REPMGR_PORT: 5432
      REPMGR_USER: repmgr
      REPMGR_PASSWORD: ${REPMGR_PASSWORD:-repmgr}
      REPMGR_CONNECT_TIMEOUT: 2
      REPMGR_RECONNECT_ATTEMPTS: 3
      REPMGR_RECONNECT_INTERVAL: 5
      REPMGR_SERVICE: "standby"
      REPMGR_DATA_DIRECTORY: "/var/lib/postgresql/data"
      REPMGR_LOG_LEVEL: INFO
      # Streaming replication config
      POSTGRES_REPLICATION_USER: repmgr
      POSTGRES_REPLICATION_PASSWORD: ${REPMGR_PASSWORD:-repmgr}
      POSTGRES_PRIMARY_CONNINFO: "host=pg-primary port=5432 user=repmgr password=${REPMGR_PASSWORD:-repmgr} dbname=${POSTGRES_DB:-langfuse}"
# mTLS client identity for repmgr/libpq connections (PP02)
      PGSSLROOTCERT: /var/lib/postgresql/certs/ca.pem
      PGSSLCERT: /var/lib/postgresql/certs/repmgr.pem
      PGSSLKEY: /var/lib/postgresql/certs/repmgr-key.pem
    entrypoint: /ha/postgres/docker-entrypoint-ha.sh
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/certs/postgres.pem
      - -c
      - ssl_key_file=/var/lib/postgresql/certs/postgres-key.pem
      - -c
      - ssl_ca_file=/var/lib/postgresql/certs/ca.pem
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=3
      - -c
      - max_replication_slots=3
      - -c
      - hot_standby=on
    volumes:
      - postgres_replica2_data:/var/lib/postgresql/data
      - ./ha/postgres/docker-entrypoint-ha.sh:/ha/postgres/docker-entrypoint-ha.sh:ro
      - ./ha/postgres/repmgr-node3.conf:/etc/repmgr.conf:ro
      # mTLS (PP02): server cert + cert-only pg_hba
      - ./ha/postgres/pg_hba_mtls.conf:/etc/postgresql/pg_hba.conf:ro
      - certs_postgres:/var/lib/postgresql/certs:ro
      # Shared volume for pgbouncer dynamic config
      - pgbouncer_dynamic:/var/lib/postgresql/pgbouncer-dynamic
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # pgBouncer for connection pooling
  pgbouncer:
    image: eduardoborba/pgbouncer:1.22-alpine
    restart: unless-stopped
    depends_on:
      certs-init:
        condition: service_completed_successfully
      pg-primary:
        condition: service_healthy
    environment:
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/users.txt
      PGBOUNCER_HBA_FILE: /etc/pgbouncer/pg_hba.conf
    volumes:
      - ./ha/postgres/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./ha/postgres/pgbouncer-users.txt:/etc/pgbouncer/users.txt:ro
      # mTLS (PP02): client-side verify-ca, upstream verify-full as langfuse
      - certs_pgbouncer:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pgbounce -c /etc/pgbouncer/pgbouncer.ini --check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "6432:6432"  # Connection pool port
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

# pgBouncer for warm-tier connection pooling
  pgbouncer-warm:
    image: eduardoborba/pgbouncer:1.22-alpine
    restart: unless-stopped
    depends_on:
      certs-init:
        condition: service_completed_successfully
      pg-primary:
        condition: service_healthy
      pg-replica-1:
        condition: service_healthy
      pg-replica-2:
        condition: service_healthy
    entrypoint: >
      sh -c 'cp -n /seed/dynamic.conf /etc/pgbouncer/dynamic.conf; exec pgbouncer /etc/pgbouncer/pgbouncer-warm.ini'
    environment:
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/users.txt
      PGBOUNCER_HBA_FILE: /etc/pgbouncer/pg_hba.conf
    volumes:
      - ./ha/postgres/pgbouncer-warm.ini:/etc/pgbouncer/pgbouncer-warm.ini:ro
      - ./ha/postgres/pgbouncer-users.txt:/etc/pgbouncer/users.txt:ro
      # mTLS (PP02): client-side verify-full, upstream verify-full as warm
      - certs_pgbouncer_warm:/certs:ro
      # Shared volume for dynamic configuration
      - ./ha/postgres/pgbouncer-warm-dynamic.conf:/seed/dynamic.conf:ro
      - pgbouncer_dynamic:/etc/pgbouncer:rw
    healthcheck:
      test: ["CMD-SHELL", "pgbounce -c /etc/pgbouncer/pgbouncer-warm.ini --check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "6433:6433"  # Warm tier connection pool port
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # pg-init-warm: Initialize warm tier database and schema
  pg-init-warm:
    image: postgres:17
    restart: on-failure
    depends_on:
      certs-init:
        condition: service_completed_successfully
      pg-primary:
        condition: service_healthy
      pg-replica-1:
        condition: service_healthy
      pg-replica-2:
        condition: service_healthy
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/var/lib/postgresql/certs/postgres.pem, -c, ssl_key_file=/var/lib/postgresql/certs/postgres-key.pem, -c, ssl_ca_file=/var/lib/postgresql/certs/ca.pem, -c, ssl_min_protocol_version=TLSv1.2, -c, hba_file=/etc/postgresql/pg_hba.conf]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langfuse}
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
    volumes:
      - ./ha/postgres/init-warm-store.sh:/docker-entrypoint-initdb.d/init-warm-store.sh:ro
      - ./ha/postgres/postgres_warm.sql:/docker-entrypoint-initdb.d/postgres_warm.sql:ro
      # mTLS (PP02): server cert + cert-only pg_hba
      - ./ha/postgres/pg_hba_mtls.conf:/etc/postgresql/pg_hba.conf:ro
      - certs_postgres:/var/lib/postgresql/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/warm-initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

# --- Redis HA: master + 2 replicas + 3 sentinel ---
  redis-master:
    image: redis:7
    restart: unless-stopped
    depends_on:
      certs-init:
        condition: service_completed_successfully
    # mTLS listener on 6380 (tls-auth-clients require); 6379 stays for
    # in-cluster app clients that cannot present client certs (PP02)
    command: redis-server /etc/redis/redis-tls.conf --requirepass ${REDIS_AUTH:-orya-local-redis-secret} --maxmemory-policy noeviction
    environment:
      REDIS_AUTH: ${REDIS_AUTH:-orya-local-redis-secret}
    volumes:
      - redis_master_data:/data
      - ./ha/redis/redis-tls.conf:/etc/redis/redis-tls.conf:ro
      - certs_redis:/etc/redis/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_AUTH} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redis-replica-1:
    image: redis:7
    restart: unless-stopped

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # One-shot operator bootstrap: init, auto-unseal check, policies, quorum.
  # Uses the same vault image (has vault CLI + jq); policies come from the
  # shared infra/vault/policies directory.
  vault-init-ha:
    image: hashicorp/vault:1.18
    restart: "no"
    cap_add: ["IPC_LOCK"]
    depends_on:
      vault-1:
        condition: service_healthy
      vault-2:
        condition: service_started
      vault-3:
        condition: service_started
    environment:
      BOOTSTRAP_ADDR: https://vault-1:8200
      VAULT_CACERT: /vault/certs/ca.pem
      VAULT_CLIENT_CERT: /vault/certs/vault.pem
      VAULT_CLIENT_KEY: /vault/certs/vault-key.pem
      VAULT_TENANTS: ${VAULT_TENANTS:-}
      VAULT_JWT_OIDC_DISCOVERY_URL: ${VAULT_JWT_OIDC_DISCOVERY_URL:-}
      VAULT_JWT_OIDC_ISSUER: ${VAULT_JWT_OIDC_ISSUER:-}
      VAULT_JWT_OIDC_AUDIENCE: ${VAULT_JWT_OIDC_AUDIENCE:-vault}
      VAULT_JWT_USER_CLAIM: ${VAULT_JWT_USER_CLAIM:-sub}
    volumes:
      - vault_raft_bootstrap:/vault/bootstrap
      - ./ha/vault/raft-init.sh:/vault/raft-init.sh:ro
      - ../vault/policies:/vault/policies:ro
      - certs_vault:/vault/certs:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["/vault/raft-init.sh"]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # --- MinIO distributed HA: 4 nodes with erasure coding ---
  minio1:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data1 /data2 && minio server --address ":9000" --console-address ":9001" http://minio1/data1 http://minio1/data2 http://minio2/data1 http://minio2/data2 http://minio3/data1 http://minio3/data2 http://minio4/data1 http://minio4/data2'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}

  ha-test-client:
    image: python:3.11-slim
    restart: unless-stopped
    depends_on:
      nginx-langfuse:
        condition: service_started
      nginx-otel:
        condition: service_started
      certs-init:
        condition: service_completed_successfully
    environment:
      LANGFUSE_HOST: https://nginx-langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-your-public-key-here}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-your-secret-key-here}
      OTEL_EXPORTER_OTLP_ENDPOINT: https://nginx-otel:4318
      # SDK mTLS identity (PP02): AGENT_OBS_TLS_CA + AGENT_OBS_TLS_CERT/KEY
      AGENT_OBS_TLS_CA: /certs/ca.pem
      AGENT_OBS_TLS_CERT: /certs/sdk.pem
      AGENT_OBS_TLS_KEY: /certs/sdk-key.pem
      OTEL_EXPORTER_OTLP_CERTIFICATE: /certs/ca.pem
      OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE: /certs/sdk.pem
      OTEL_EXPORTER_OTLP_CLIENT_KEY: /certs/sdk-key.pem
    volumes:
      - ../:/app:ro
      - certs_sdk:/certs:ro
    working_dir: /app
    command: >
      sh -c "pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp &&
             python -m http.server 8777 --bind 0.0.0.0 & 
             python -c 'from test_ha_client import send_test_span; send_test_span()' &&
             python -m http.server 8777 --bind 0.0.0.0"

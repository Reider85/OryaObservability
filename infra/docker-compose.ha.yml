      certs-init:
        condition: service_completed_successfully
      redis-master:
        condition: service_healthy
    command: redis-server /etc/redis/redis-tls.conf --replicaof redis-master 6379 --requirepass ${REDIS_AUTH:-orya-local-redis-secret} --maxmemory-policy noeviction
    environment:
      REDIS_AUTH: ${REDIS_AUTH:-orya-local-redis-secret}
    volumes:

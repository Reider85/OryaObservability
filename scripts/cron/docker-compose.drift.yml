version: '3.8'

services:
  drift-detector:
    build:
      context: ..
      dockerfile: scripts/cron/Dockerfile
    container_name: drift-detector
    restart: unless-stopped
    environment:
      # ClickHouse configuration
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_DB=observability
      - CLICKHOUSE_USER=observability_user
      - CLICKHOUSE_PASSWORD=observability_password
      
      # Drift detection configuration
      - DRIFT_INTERVAL_SECONDS=900
      - DRIFT_BASELINE_HOURS=168
      - DRIFT_LAST_WINDOW_HOURS=1
      - DRIFT_KL_THRESHOLD=0.1
      - DRIFT_AGENT_IDS=default_agent,chat_agent,code_agent
      
      # Logging
      - PYTHONUNBUFFERED=1
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - orya-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  orya-network:
    external: true
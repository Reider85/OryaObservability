[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-obs"
version = "0.1.0"
description = "Observability SDK for LLM agents (traces, cost tracking, metrics)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "presidio-analyzer>=2.0",
    "spacy>=3.7",
    "transformers>=4.40",
    "torch>=2.0",
    "jsonschema>=4.20",
    "rq>=1.14",
    "redis>=5.0",
    "clickhouse-driver>=0.2.7",
    "hvac>=2.0.0",
    "pyotp>=2.9",
    "numpy>=1.20",
    "psutil>=5.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "moto[s3]>=5.0",
    "boto3>=1.34",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pandas>=2.0",
]
# PC21 tiered-retention cron jobs. Deliberately NOT runtime dependencies: the
# SDK never writes to the warm or cold tier, only the out-of-process cron
# service does. Kept in sync with infra/cron/Dockerfile.
cron = [
    "boto3>=1.34",
    "pyarrow>=15.0",
    "asyncpg>=0.29",
    # PC28: Phoenix UMAP visualizer export (optional, only for drift root-cause)
    # httpx is already in main dependencies
]

[tool.setuptools.packages.find]
include = ["agent_obs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# scripts/ is a namespace package that is not installed via pip; tests import
# scripts.sampler.*, so the repo root must be on sys.path.
pythonpath = ["."]
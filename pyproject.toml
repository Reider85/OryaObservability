[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-obs"
version = "0.1.0"
description = "Observability SDK for LLM agents (traces, cost tracking, metrics)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "presidio-analyzer>=2.0",
    "spacy>=3.7",
    "transformers>=4.40",
    "torch>=2.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["agent_obs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]